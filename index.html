<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ставок | Bet Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📊 Калькулятор ставок</h1>

    <!-- Баланс -->
    <div class="card balance-display">
        <h2>Итоговый баланс</h2>
        <div class="amount" id="currentBalance">0 ₽</div>
        <div class="profit zero" id="profitDisplay">Прибыль: 0 ₽</div>
    </div>

    <!-- Настройки -->
    <div class="card">
        <div class="form-group">
            <label for="initialBalance">Начальный баланс (₽)</label>
            <input type="number" id="initialBalance" placeholder="Например: 10000" min="0">
        </div>
    </div>

    <!-- Добавление ставки -->
    <div class="card">
        <h3 style="margin-top: 0;">Новая ставка</h3>
        <div class="row">
            <div class="form-group">
                <label for="betAmount">Сумма ставки (₽)</label>
                <input type="number" id="betAmount" placeholder="1000" min="1">
            </div>
            <div class="form-group">
                <label for="betOdds">Коэффициент</label>
                <input type="number" id="betOdds" placeholder="1.85" min="1.01" step="0.01">
            </div>
        </div>
        <button class="btn-primary" id="addBetBtn">Добавить ставку</button>
    </div>

    <!-- История -->
    <div class="card">
        <h3 style="margin-top: 0;">История ставок</h3>
        <ul class="bet-list" id="betList">
            <!-- Ставки будут добавляться сюда через JS -->
        </ul>
        <button class="btn-reset" id="resetAllBtn">🗑️ Очистить всё и начать заново</button>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
